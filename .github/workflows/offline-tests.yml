name: Offline Strategy Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot
        run: python -m py_compile bot.py altcoin_bot.py test_bot_offline.py test_altcoin_bot_offline.py
      - name: Run offline tests (no exchange credentials or orders)
        run: python -m unittest -v test_bot_offline test_altcoin_bot_offline
